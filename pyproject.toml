[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kompas-mcp"
version = "0.1.0"
description = "Practical MCP server for KOMPAS-3D cleanup workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1,<2",
]

[project.scripts]
kompas-mcp = "kompas_mcp.__main__:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
