[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomwright"
version = "0.1.0"
description = "Local-first KOMPAS-3D CAD automation with MCP tools and Studio"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kostia Egik" }]
requires-python = ">=3.11"
dependencies = [
  "mcp>=1,<2",
]

keywords = ["cad", "kompas-3d", "mcp", "parametric-cad", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/kostia-egik/geomwright"
Repository = "https://github.com/kostia-egik/geomwright"
Issues = "https://github.com/kostia-egik/geomwright/issues"

[project.optional-dependencies]
ui = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.30,<1",
]

[project.scripts]
geomwright-mcp = "geomwright.__main__:main"
geomwright-studio = "geomwright.studio.__main__:main"
kompas-mcp = "kompas_mcp.__main__:main"
kompas-mechanics-ui = "geomwright.studio.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kompas_mcp = [
  "assets/rules/*.json",
  "assets/bridge/*.py",
]
geomwright = [
  "studio/static/*.css",
  "studio/static/*.js",
  "studio/static/icons/*.svg",
  "studio/templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
