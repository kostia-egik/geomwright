name: Tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build and install package with test dependencies
        run: python scripts/run_bounded.py --timeout 180 -- python -m pip install ".[ui]" pytest

      - name: Run host-side tests
        run: python scripts/run_bounded.py --timeout 600 -- python -m pytest -q
